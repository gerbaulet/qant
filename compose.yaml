services:
  quant-server:
    build:
      context: .
    image: quant-server:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      QUANT_LISTEN_ADDR: ":8080"
      QUANT_DATA_DIR: "/data"
      QUANT_OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
      QUANT_ALLOW_UNAUTHENTICATED: "false"
      QUANT_MAX_CONCURRENT_JOBS: "3"
      QUANT_MAX_REQUEST_BYTES: "26214400"
      QUANT_JOB_TTL: "168h"
      QUANT_UPSTREAM_TIMEOUT: "2m"
    volumes:
      - quant-server-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "/quant-server", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  quant-server-data:
